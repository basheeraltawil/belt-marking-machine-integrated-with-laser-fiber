; Belt marking machine - Arduino Mega 2560 firmware
; Build:   pio run -e megaatmega2560
; Flash:   pio run -e megaatmega2560 -t upload --upload-port /dev/belt_arduino
; Tests:   pio test -e native        (protocol + logic on the PC, no board needed)

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_deps =
    waspinator/AccelStepper@^1.64
build_flags = -Wall -Wextra
build_src_filter = +<*>

[env:native]
platform = native
build_flags = -std=c++11 -Wall -Wextra -DNATIVE_BUILD
test_build_src = no
lib_compat_mode = off
